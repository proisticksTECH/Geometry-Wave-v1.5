<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Wave - Game Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      color: white;
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.2em;
      margin-bottom: 40px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    .game-card {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: #333;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .game-card h2 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 1.8em;
    }

    .game-card p {
      color: #666;
      margin-bottom: 15px;
    }

    .play-button {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .play-button:hover {
      transform: scale(1.05);
    }

    .footer {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9em;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      .subtitle {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Geometry Wave</h1>
    <p class="subtitle">Check out my game collection!</p>

    <div class="games-grid">
      <a href="Geometry%20wave!%20v1.4.html" class="game-card">
        <h2>Geometry Wave v1.4</h2>
        <p>Experience the geometric challenge and test your skills with waves of geometry puzzles.</p>
        <span class="play-button">Play Game</span>
      </a>
    </div>

    <p class="footer">
      Created with TurboWarp Packager<br>
      © 2024 proisticksTECH
    </p>
  </div>
</body>
</html>
